<!DOCTYPE html>
<html lang="su">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Sunda 😄</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #e6f0ff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

    h1 {
      color: #004aad;
      margin-top: 20px;
    }

    .chat-box {
      width: 90%;
      max-width: 420px;
      background: #fff;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      flex-grow: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
    }

    .message {
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      background: #004aad;
      color: #fff;
      align-self: flex-end;
    }

    .bot {
      background: #f2f6ff;
      color: #000;
      align-self: flex-start;
    }

    .input-box {
      display: flex;
      width: 90%;
      max-width: 420px;
    }

    input {
      flex-grow: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      margin-left: 5px;
      background: #004aad;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }

    button:hover {
      background: #0066ff;
    }
  </style>
</head>
<body>
  <h1>🤖 Mini Chat Sunda</h1>
  <div class="chat-box" id="chatBox"></div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Tulis pesen di dieu..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>

  <script>

      else if (msg.includes("cuaca")) reply = "Cuaca ayeuna siga haté, kadang panas kadang tiis 😅";

      else if (msg.includes("temenan")) reply = "Temenan téh kudu jujur jeung teu ngadadak ilang 😆";
      else if (msg.includes("sakit")) reply = "Cepet damang nya, tong poho ubaran 💊";
      else if (msg.includes("hebat")) reply = "Wah, anjeun hebat pisan! 🔥";
      else if (msg.includes("motivasi")) reply = "Sing kuat, Gusti moal ninggalkeun nu sabar 💪";

      else if (msg.includes("doa")) reply = "Doa téh senjata jalma beriman 🙏";
      else if (msg.includes("kerupuk")) reply = "Kerupuk téh wajib mun aya sambel 🌶️";
      else if (msg.includes("mimpi")) reply = "Mimpi téh kudu dikejar, ulah ngan dipikir 💭";
      else if (msg.includes("tidur")) reply = "Sare atuh, bisi beunang capé 😴";
      else if (msg.includes("bangun")) reply = "Bangun heula, waktuna produktif 😁";
      else if (msg.includes("kerja")) reply = "Sing kuat kerja, rejeki moal telat 💪";
      else if (msg.includes("bye")) reply = "Dugi ka tepang deui, wilujeng jalan 👋";
      else reply = "Hehe, abdi teu ngartos maksudna 😅";

      return reply;
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const msg = input.value.trim();
      if (!msg) return;

      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.textContent = msg;
      chatBox.appendChild(userMsg);

      const botMsg = document.createElement("div");
      botMsg.className = "message bot";
      botMsg.textContent = respond(msg);
      chatBox.appendChild(botMsg);

      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";
    }
  </script>
</body>
</html>
